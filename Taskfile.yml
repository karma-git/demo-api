---

version: "3"

env:
  HELM_PATH: .helm/demo-api

tasks:
  default:
    cmds:
      - task --list-all
    silent: true

  # docker-compose tasks
  dc-up:
    desc: Start all containers
    cmd: docker compose up

  dc-build:
    desc: Build all container images
    cmd: docker compose --build

  dc-push:
    desc: Push images to registry
    cmd: docker compose push

  dc-clean:
    desc: Stop and remove all containers
    cmd: docker compose down

  dc-http:
    desc: Curl all running demo-api containers and print JSON responses
    cmd: |
      docker container ls --format json \
        | jq -r 'select(.Networks == "demo-api") | .Ports' \
        | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+:[0-9]+' \
        | while read -r target; do
            echo "--- http://$target ---"
            body=$(curl -s "http://$target/api")
            if echo "$body" | jq -e '.language' >/dev/null 2>&1; then
              echo "$body" | jq
            else
              curl -s "http://$target" | jq
            fi
          done

  # helm tasks
  helm-install:
    desc: Install or upgrade demo-api Helm release into namespace demo
    cmd: |
      helm upgrade --install demo-api $HELM_PATH \
        --create-namespace \
        --namespace demo \
        --wait --timeout 5m \
        --atomic \
        --values $HELM_PATH/values.yaml

  helm-uninstall:
    desc: Uninstall demo-api Helm release from namespace demo
    cmd: |
      helm uninstall demo-api \
        --namespace demo
